<body>
    <div class="main_container">
             <h1>Welcome to My Weather.</h1>
      
        <div class="container">
         
            <div class="input">

                <input type="text" name="city" id="city" placeholder="Enter city">
                
                <input type="text" name="country" id = "country" placeholder="Enter Country">
            <button type="button">Search</button>
            </div>
        </div>
        <div class="result">
            <div class="img">
                <img src="" alt="Cloud image">
            <p></p>
            </div>
            <div class="temp card">  
                <p>Temerature : _______</p>
            </div>
            <div class="otherData">
                <div class="humidity card">
                <p>Humidity : ________</p>
            </div>
            <div class="wind card">
                <p>
                    Wind : ________
                </p>
            </div>
            </div>


        </div>
